# Arranque: copiar .env.example a .env (opcional) y ejecutar `docker compose up --build`.
# La imagen del backend es autosuficiente (sin bind mounts ni --reload).
services:
  db:
    image: postgres:16
    container_name: series76_postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konecto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konecto_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-series76_db}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-konecto} -d ${POSTGRES_DB:-series76_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: series76_backend
    restart: unless-stopped
    mem_limit: 1g
    # .env es opcional: sin el, se usan los valores por defecto de demostracion y no hay LLM (modo plantilla).
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro de la red de compose la DB es siempre db:5432 (lo que diga DATABASE_URL en .env no aplica aqui).
      DATABASE_URL: postgresql://${POSTGRES_USER:-konecto}:${POSTGRES_PASSWORD:-konecto_secret_2026}@db:5432/${POSTGRES_DB:-series76_db}
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    command: >
      sh -c "python scripts/ingest.py --mode auto &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
