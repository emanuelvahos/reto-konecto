services:
  db:
    image: postgres:16
    container_name: series76_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konecto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konecto_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-series76_db}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-konecto} -d ${POSTGRES_DB:-series76_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: series76_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
      - ./docs:/app/docs:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python scripts/ingest.py --mode auto &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:

